name: Release

# Single-stage release: pushing a version tag (vX.Y.Z) runs the tests, then builds
# the macOS + Windows installers AND creates the GitHub Release with them attached —
# all in one run under the built-in token (no RELEASE_PAT needed).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # Test gate: a failure here stops the build, so this platform's installer
      # is never produced. Runs on each OS, re-checking the Windows path logic.
      - name: Frontend tests
        run: npm test

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installers and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "See the assets below to download and install."
          # Publishes the release as soon as both builds finish. Set to true if
          # you'd rather review a draft and publish it manually.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
