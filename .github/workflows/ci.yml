name: CI

# Runs the test suites on every push to main and on pull requests, so a broken
# change is caught immediately — long before you cut a release.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Rust lib links against Tauri's webview, so the dev libraries must be
      # present even just to compile the tests on Linux.
      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend tests
        run: npm test

      - name: Backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
